[project]
name = "fin-c2-070"
version = "0.1.0"
description = "Financial Advisory Call Compliance & Suitability Check Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by the CI test job. Pinning it here
# would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework wheel ships no py.typed, so mypy resolves AgentBaseGraph/FunctionNode to
# Any. State that once here rather than scattering ignores on every node class.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# Dependencies without type information. Remove and re-measure once the wheel ships py.typed.
module = ["framework.*", "shared.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true
